[project]
name = "genai-langchain-agenteavaliador"
version = "0.1.0"
description = "Agente avaliador de reviews com LangChain e Groq"
authors = [
    {name = "Leandro Mario",email = "leandromario@hotmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
